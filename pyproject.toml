[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "work-items"
version = "0.0.3"
description = "A self-hosted, local-first work-item manager"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TinyWhite1997" }]
classifiers = ["Programming Language :: Python :: 3"]

[project.scripts]
work-items = "work_items.app:main"

[tool.setuptools]
packages = ["work_items"]
include-package-data = false

[tool.setuptools.package-data]
work_items = ["web/**"]
